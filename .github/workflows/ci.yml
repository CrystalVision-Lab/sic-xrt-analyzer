name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 xvfb libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0
      # Keep the viewer comparison on TD-12's validated Qt runtime. Full-suite
      # finalization under 6.12 remains a separate compatibility investigation.
      - run: python -m pip install -e ".[dev,viewer,imagej,research,sync]" "PySide6==6.11.2"
      - run: python tools/setup_imagej.py
      - uses: actions/cache@v4
        with:
          path: artifacts/fiji-runtime
          key: fiji-java-libraries-${{ hashFiles('tools/setup_fiji.py') }}
      - run: python tools/setup_fiji.py
      - run: ruff check .
      - run: python -c "import sic_xrt_analyzer"
      - run: python -m compileall -q src
      - name: Build desktop wheel
        run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          SIC_XRT_FIJI_HOME: artifacts/fiji-runtime
      - name: Verify real plugin windows on Linux X11
        if: success() || failure()
        run: xvfb-run -a pytest -q tests/test_stack_compatibility.py -k gui_plugin
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RENDER_LOOP: basic
      - name: Validate PR policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python .github/scripts/check_pr.py

  server-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xrt
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: xrt_ci_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U xrt -d xrt_ci_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install -e ./server pytest
      - name: Check isolated server dependencies
        run: python -c "import importlib.util as u; assert all(u.find_spec(n) is None for n in ('PySide6','onnxruntime','jpype'))"
      - run: python -m pytest -q server/tests
        env:
          XRT_TEST_PG_CLIENT_CONTAINER: ${{ job.services.postgres.id }}
          XRT_TEST_DATABASE_URL: postgresql+psycopg://xrt:isolated-ci-only@localhost:5432/xrt_ci_test

name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 xvfb libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 gdb
      - run: python -m pip install -e ".[dev,viewer,imagej]"
      - run: python tools/setup_imagej.py
      - uses: actions/cache@v4
        with:
          path: artifacts/fiji-runtime
          key: fiji-java-libraries-${{ hashFiles('tools/setup_fiji.py') }}
      - run: python tools/setup_fiji.py
      - run: ruff check .
      - run: python -c "import sic_xrt_analyzer"
      - run: python -m compileall -q src
      - run: xvfb-run -a gdb --batch --return-child-result -ex run -ex "thread apply all bt" --args python -m pytest -v
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RENDER_LOOP: basic
          SIC_XRT_FIJI_HOME: artifacts/fiji-runtime
      - name: Verify real plugin windows on Linux X11
        if: success() || failure()
        run: xvfb-run -a pytest -q tests/test_stack_compatibility.py -k gui_plugin
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RENDER_LOOP: basic
      - name: Validate PR policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python .github/scripts/check_pr.py

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "xrt-research-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "httpx>=0.27,<1", "Pillow>=10", "numpy>=1.26", "tifffile>=2024.2", "cryptography>=46,<47", "packaging>=24"]
[tool.setuptools.packages.find]
where = ["."]
include = ["xrt_server*"]

[project.optional-dependencies]
models = ["psutil>=5.9", "onnx>=1.23.1,<2", "onnxruntime>=1.18,<2"]

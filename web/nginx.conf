# Docker service IPs can change after restart/recreation. Resolve them at runtime.
# Shared zones are required by nginx's dynamic upstream resolver (nginx >= 1.27.3).
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;
upstream xrt_portal {
 zone xrt_portal 64k;
 server portal:8001 resolve;
}
upstream xrt_api {
 zone xrt_api 64k;
 server api:8000 resolve;
}

server {
 listen 8080;
 server_name _;
 absolute_redirect off;
 root /usr/share/nginx/html;
 client_max_body_size 32m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Cache-Control "no-store" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /portal-api/ {
  proxy_pass http://xrt_portal;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 300s;
 }
 location /api/v1/ {
  proxy_pass http://xrt_api;
  proxy_set_header Host $http_host;
  proxy_buffering off;
  proxy_read_timeout 150s;
 }
 location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
 # Only bootstrap assets and the access/admin entry shells are anonymous.
 location = /app-logo.png { try_files $uri =404; }
 location = /access { try_files /index.html =404; }
 location ~ ^/admin(?:/|$) { try_files /index.html =404; }
 location = /_site_auth {
  internal;
  proxy_pass http://xrt_portal/portal-api/access/check;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Host $http_host;
 }
 location / {
  auth_request /_site_auth;
  error_page 401 403 = @access_denied;
  try_files $uri $uri/ /index.html;
 }
 location @access_denied { return 302 /access; }
}
